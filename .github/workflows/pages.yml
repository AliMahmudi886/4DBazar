name: GitHub Pages

on:
  push:
    branches: [audit/enterprise-marketplace-transformation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci --include=dev
      - run: npm run build -w @four-d/shared
      - run: npm run build -w @four-d/web
        env:
          FOURD_WEB_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE_URL: https://fourd-api-preview.onrender.com
      - name: Prepare static workspace routes
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          for route in profile admin; do
            mkdir -p "apps/web/dist/$route"
            cp apps/web/dist/index.html "apps/web/dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - uses: actions/deploy-pages@v4
        id: publish
